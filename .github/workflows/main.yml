name: Build APK Yeastar

# Ce fichier unique contient TOUTE l'application (encodee).
# GitHub reconstruit le projet et compile l'APK automatiquement.
on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (contexte git)
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer composants Android
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

