        run: |
          echo "$PROJECT_B64" | base64 -di > project.zip
          unzip -q project.zip
          echo "=== Contenu ==="
          ls -R YeastarQueueApp | head -40

      - name: Compiler l'APK
        run: |
          cd YeastarQueueApp
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Recuperer l'APK
        run: |
          mkdir -p out
          cp YeastarQueueApp/app/build/outputs/apk/debug/app-debug.apk out/AppelFileYeastar.apk
          ls -lh out

      - name: Publier l'APK (artefact telechargeable)
        uses: actions/upload-artifact@v4
        with:
          name: AppelFileYeastar-APK
          path: out/AppelFileYeastar.apk

      - name: Publier la Release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Derniere version APK
          files: out/AppelFileYeastar.apk
          body: |
            APK de debug de l'application Appel File Yeastar.
            Telechargez AppelFileYeastar.apk ci-dessous et installez-le sur Android.
