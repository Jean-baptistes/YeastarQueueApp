        run: |
          echo "$PROJECT_B64" | base64 -di > project.zip
          unzip -q project.zip
          ls -R YeastarQueueApp | head -30
      - name: Compiler l'APK
        run: |
          cd YeastarQueueApp
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Recuperer l'APK
        run: |
          mkdir -p out
          cp YeastarQueueApp/app/build/outputs/apk/debug/app-debug.apk out/AppelFileYeastar.apk
          ls -lh out
      - name: Publier l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: AppelFileYeastar-APK
          path: out/AppelFileYeastar.apk
      - name: Publier la Release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Derniere version APK
          files: out/AppelFileYeastar.apk
          body: |
            APK Appel File Yeastar - plage + mot de passe commun + verification API (extensions libres) + appel 6400.
